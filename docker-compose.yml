services:
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_directory
      MYSQL_USER: springstudent
      MYSQL_PASSWORD: springstudent
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./inventory-system
      dockerfile: Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_directory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: springstudent
      DB_PASSWORD: springstudent
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      FIREBASE_SERVICE_ACCOUNT_PATH: file:/app/secrets/firebase-service-account.json
    ports:
      - "8080:8080"
    volumes:
      - ./inventory-system/src/main/resources/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro

volumes:
  mysql_data: